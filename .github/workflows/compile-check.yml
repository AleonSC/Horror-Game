# Opens the scripts in the real Unity editor on every push and pull request, so compile errors show up here
# (a red X on the commit) instead of in the editor after pulling.
#
# The repository holds only the scripts, so this sets up a minimal Unity project round them first: the
# editor version and the packages they need. If you'd rather it used your exact setup, commit your own
# Packages/manifest.json and ProjectSettings/ProjectVersion.txt and it'll use those instead.
#
# It needs a Unity license, given to it as repository secrets (Settings > Secrets and variables > Actions):
#   UNITY_LICENSE   the contents of your Unity license file (.ulf)
#   UNITY_EMAIL     your Unity account email
#   UNITY_PASSWORD  your Unity account password
# How to get the license file: https://game.ci/docs/github/activation
# Until they're set, the check is skipped (with a note saying so) rather than failing.
name: Compile check

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: compile-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile in Unity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UNITY_VERSION: 6000.6.6f1
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: No license yet
        if: env.UNITY_LICENSE == ''
        run: echo "::notice::Compile check skipped - add the UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD repository secrets to turn it on (see .github/workflows/compile-check.yml)."

      - uses: actions/checkout@v4
        if: env.UNITY_LICENSE != ''

      - name: Set up a minimal Unity project round the scripts
        if: env.UNITY_LICENSE != ''
        run: |
          mkdir -p ProjectSettings Packages
          if [ ! -f ProjectSettings/ProjectVersion.txt ]; then
            echo "m_EditorVersion: $UNITY_VERSION" > ProjectSettings/ProjectVersion.txt
          fi
          if [ ! -f Packages/manifest.json ]; then
            cat > Packages/manifest.json <<'JSON'
          {
            "dependencies": {
              "com.unity.render-pipelines.universal": "17.6.0",
              "com.unity.test-framework": "1.5.1",
              "com.unity.ugui": "2.0.0",
              "com.unity.modules.ai": "1.0.0",
              "com.unity.modules.animation": "1.0.0",
              "com.unity.modules.audio": "1.0.0",
              "com.unity.modules.imageconversion": "1.0.0",
              "com.unity.modules.imgui": "1.0.0",
              "com.unity.modules.jsonserialize": "1.0.0",
              "com.unity.modules.particlesystem": "1.0.0",
              "com.unity.modules.physics": "1.0.0",
              "com.unity.modules.physics2d": "1.0.0",
              "com.unity.modules.screencapture": "1.0.0",
              "com.unity.modules.terrain": "1.0.0",
              "com.unity.modules.terrainphysics": "1.0.0",
              "com.unity.modules.ui": "1.0.0",
              "com.unity.modules.uielements": "1.0.0",
              "com.unity.modules.umbra": "1.0.0",
              "com.unity.modules.unitywebrequest": "1.0.0",
              "com.unity.modules.video": "1.0.0",
              "com.unity.modules.vr": "1.0.0",
              "com.unity.modules.wind": "1.0.0"
            }
          }
          JSON
          fi

      - uses: actions/cache@v4
        if: env.UNITY_LICENSE != ''
        with:
          path: Library
          key: Library-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/manifest.json') }}-${{ hashFiles('Assets/**/*.cs') }}
          restore-keys: |
            Library-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/manifest.json') }}-
            Library-${{ env.UNITY_VERSION }}-

      # Opening the project compiles every script (game and editor); any error fails this step. There are no
      # tests yet, so "running" them is just the compile.
      - name: Compile
        if: env.UNITY_LICENSE != ''
        uses: game-ci/unity-test-runner@v4
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Compile check
